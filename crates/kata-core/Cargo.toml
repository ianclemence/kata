[package]
name = "kata-core"
description = "Image processing, mask refinement, sticker styling and the segmentation interface for Kata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Web: threads need a nightly standard library and atomics; off by default so a
# plain `cargo build --target wasm32-unknown-unknown` works on stable.
wasm-threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.3", optional = true }
