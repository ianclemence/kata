[workspace]
resolver = "2"
members = ["crates/kata-core", "crates/kata-engine", "crates/kata-mcp", "crates/kata-cli", "crates/kata-web"]
exclude = ["crates/kata-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ianclemence/kata"
homepage = "https://github.com/ianclemence/kata"
readme = "README.md"
keywords = ["background-removal", "mcp", "design", "screen-print", "poster"]
categories = ["multimedia::images", "command-line-utilities"]

[workspace.dependencies]
kata-core = { path = "crates/kata-core" }
kata-engine = { path = "crates/kata-engine" }
kata-mcp = { path = "crates/kata-mcp" }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "bmp",
  "tiff",
] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.kata-web]
opt-level = "s"

[profile.dev]
# Image work is unusable in a debug build without this.
opt-level = 1
